<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track & Trace Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
    <header>
        <h1>Shipment Track &amp; Trace</h1>
        <p>Create shipments, record tracking events, and follow deliveries end-to-end.</p>
    </header>

    <section class="form-section">
        <h2>Create Shipment</h2>
        <form id="create-shipment-form">
            <div class="form-row">
                <label for="recipient">Recipient</label>
                <input id="recipient" name="recipient" type="text" maxlength="100" required>
            </div>
            <div class="form-row">
                <label for="destination">Destination</label>
                <input id="destination" name="destination" type="text" maxlength="150" required>
            </div>
            <div class="form-row">
                <label for="status">Initial Status</label>
                <select id="status" name="status">
                    <option value="CREATED">Created</option>
                    <option value="IN_TRANSIT">In Transit</option>
                    <option value="DELAYED">Delayed</option>
                    <option value="DELIVERED">Delivered</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>
            <button type="submit">Create Shipment</button>
            <p class="feedback" id="create-feedback"></p>
        </form>
    </section>

    <section class="shipments-section">
        <div class="shipments-header">
            <h2>Shipments</h2>
            <button id="refresh">Refresh</button>
        </div>
        <table id="shipments-table">
            <thead>
            <tr>
                <th>Tracking #</th>
                <th>Recipient</th>
                <th>Destination</th>
                <th>Status</th>
                <th>Created</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section class="timeline-section" hidden>
        <h2>Tracking Timeline</h2>
        <div id="timeline"></div>

        <h3>Add Tracking Event</h3>
        <form id="add-event-form">
            <input type="hidden" id="event-tracking-number">
            <div class="form-row">
                <label for="event-location">Location</label>
                <input id="event-location" name="location" type="text" maxlength="120" required>
            </div>
            <div class="form-row">
                <label for="event-description">Description</label>
                <input id="event-description" name="description" type="text" maxlength="200" required>
            </div>
            <div class="form-row">
                <label for="event-status">Status</label>
                <select id="event-status" name="status" required>
                    <option value="CREATED">Created</option>
                    <option value="IN_TRANSIT">In Transit</option>
                    <option value="DELAYED">Delayed</option>
                    <option value="DELIVERED">Delivered</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>
            <button type="submit">Add Event</button>
            <p class="feedback" id="event-feedback"></p>
        </form>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
